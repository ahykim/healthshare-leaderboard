services:
  pushups:
    build: .
    ports:
      - "80:8000"
    environment:
      TZ: America/New_York
      CHALLENGE_START: "2026-10-01"
      CHALLENGE_END: "2026-10-31"
    # POSTGRES_URL, SUPABASE_URL and SUPABASE_SECRET_KEY come from a .env file (see .env.example). Never commit it.
    env_file:
      - .env
    restart: unless-stopped
